name: Recruitment platform CI

on:
  pull_request:
    paths:
      - "recruitment-platform/**"
      - ".github/workflows/recruitment-platform-ci.yml"
  push:
    branches: [main, feat/unified-recruitment-backend]
    paths:
      - "recruitment-platform/**"
      - ".github/workflows/recruitment-platform-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitment-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
