name: Recruitment platform CI

on:
  pull_request:
    paths:
      - "recruitment-platform/**"
      - ".github/workflows/**"
  push:
    branches: [main, feat/neon-recruitment-api]
    paths:
      - "recruitment-platform/**"
      - ".github/workflows/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitment-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: recruitment-platform/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
